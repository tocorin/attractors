<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attractors Visualization</title>
    <link href="./src/styles/fonts.css" rel="stylesheet">
    <link href="./src/styles/main.css" rel="stylesheet">
</head>
<body>
    <div id="canvas-container"></div>
    <div id="controls">
        <h3>🎛️ Ручки</h3>
        <label for="system-select">Система:</label>
        <select id="system-select">
            <option value="lorenz">Лоренц (хаос)</option>
            <option value="rossler">Рёсслер</option>
            <option value="custom">Своя (в коде)</option>
        </select>
        <label>σ (sigma):</label>
        <input type="number" id="sigma" value="10" step="0.1" />

        <label>ρ (rho):</label>
        <input type="number" id="rho" value="28" step="0.1" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
